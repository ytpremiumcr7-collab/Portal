name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piedra_angular
          MYSQL_USER: piedra
          MYSQL_PASSWORD: piedra_dev_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://piedra:piedra_dev_local@127.0.0.1:3306/piedra_angular
      PA_STORAGE_PATH: ./storage
      ARES_STORAGE_PATH: ./storage
      PA_ENVELOPE_KEY: cGllZHJhLWFuZ3VsYXItZGV2LWVudmVsb3BlLWtleSE=
      ARES_ENVELOPE_KEY: cGllZHJhLWFuZ3VsYXItZGV2LWVudmVsb3BlLWtleSE=
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Migrate (required before tests / concurrency DB)
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            echo "Applying $f"
            mysql -h 127.0.0.1 -u piedra -ppiedra_dev_local piedra_angular < "$f"
          done
      - name: Unit tests
        run: npm test
      - name: Static governance
        run: npm run test:static
