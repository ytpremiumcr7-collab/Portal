services:
  mysql:
    image: mariadb:11.8
    container_name: ares-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ares
      MYSQL_USER: ares
      MYSQL_PASSWORD: ares_dev_local
      MYSQL_ROOT_PASSWORD: ares_root_local
    ports:
      - "3306:3306"
    volumes:
      - ares_mysql_data:/var/lib/mysql
      - ./db/migrations/0001_ares_mexico_baseline.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - ./db/migrations/0002_phase1_expediente.sql:/docker-entrypoint-initdb.d/02.sql:ro
      - ./db/migrations/0003_phase2_dominios_transaccionales.sql:/docker-entrypoint-initdb.d/03.sql:ro
      - ./db/migrations/0004_phase3_ciclo_completo.sql:/docker-entrypoint-initdb.d/04.sql:ro
      - ./db/migrations/0005_audit_harden_sod.sql:/docker-entrypoint-initdb.d/05.sql:ro
      - ./db/migrations/0006_sod_procedimiento.sql:/docker-entrypoint-initdb.d/06.sql:ro
      - ./db/migrations/0007_evaluation_freeze_doc_fks.sql:/docker-entrypoint-initdb.d/07.sql:ro
      - ./db/migrations/0008_procedure_policy.sql:/docker-entrypoint-initdb.d/08.sql:ro
      - ./db/migrations/0009_proposiciones.sql:/docker-entrypoint-initdb.d/09.sql:ro
      - ./db/migrations/0010_outbox.sql:/docker-entrypoint-initdb.d/10.sql:ro
      - ./db/migrations/0011_audit_harden.sql:/docker-entrypoint-initdb.d/11.sql:ro
      - ./db/migrations/0012_audit_hash_consorcios.sql:/docker-entrypoint-initdb.d/12.sql:ro
      - ./db/migrations/0013_preprod_p0p1.sql:/docker-entrypoint-initdb.d/13.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ares_mysql_data:
