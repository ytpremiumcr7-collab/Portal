services:
  mysql:
    image: mariadb:11.8
    container_name: piedra-angular-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: piedra_angular
      MYSQL_USER: piedra
      MYSQL_PASSWORD: piedra_dev_local
      MYSQL_ROOT_PASSWORD: piedra_root_local
    ports:
      - "3306:3306"
    volumes:
      - piedra_mysql_data:/var/lib/mysql
      # Dynamic full migration set (same as CI / scripts/migrate-local.sh) — no hardcoded partial list.
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts/docker-init-migrate.sh:/docker-entrypoint-initdb.d/99-migrate.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  piedra_mysql_data:
